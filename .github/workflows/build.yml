name: Build Unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Use a known Xcode version instead of whatever happens to be default.
      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode_16.4.app
          echo "Xcode:"
          xcodebuild -version
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-version
      # Install CocoaPods only when the project actually uses it.
      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -e
          if find . -name "Podfile" \
              -not -path "*/Pods/*" \
              -print -quit | grep -q .; then
            echo "Podfile found."
            sudo gem install cocoapods --no-document
            PODFILE=$(find . -name "Podfile" \
              -not -path "*/Pods/*" \
              -print -quit)
            PODDIR=$(dirname "$PODFILE")
            cd "$PODDIR"
            if [ -f "Podfile.lock" ]; then
              pod install --deployment
            else
              pod install
            fi
            cd "$GITHUB_WORKSPACE"
          else
            echo "No Podfile found. Skipping CocoaPods."
          fi
      # Find the actual Xcode container AFTER CocoaPods.
      - name: Find Xcode project
        id: container
        shell: bash
        run: |
          set -e
          WORKSPACE=$(find . \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)
          PROJECT=$(find . \
            -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -print -quit)
          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Xcode workspace:"
            echo "$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Xcode project:"
            echo "$PROJECT"
          else
            echo "::error::No .xcworkspace or .xcodeproj was found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
      # Ask Xcode for the real schemes.
      # We do NOT assume the scheme has the same name as the project.
      - name: Find shared scheme
        id: scheme
        shell: bash
        run: |
          set -e
          TYPE="${{ steps.container.outputs.type }}"
          PATH_TO_CONTAINER="${{ steps.container.outputs.path }}"
          if [ "$TYPE" = "workspace" ]; then
            xcodebuild \
              -list \
              -json \
              -workspace "$PATH_TO_CONTAINER" \
              > "$RUNNER_TEMP/xcode-list.json"
          else
            xcodebuild \
              -list \
              -json \
              -project "$PATH_TO_CONTAINER" \
              > "$RUNNER_TEMP/xcode-list.json"
          fi
          echo "Xcode project information:"
          cat "$RUNNER_TEMP/xcode-list.json"
          SCHEME=$(python3 - "$RUNNER_TEMP/xcode-list.json" <<'PY'
import json
import sys
with open(sys.argv[1], "r") as f:
    data = json.load(f)
schemes = []
if "workspace" in data:
    schemes = data["workspace"].get("schemes", [])
elif "project" in data:
    schemes = data["project"].get("schemes", [])
schemes = [x.strip() for x in schemes if x.strip()]
if not schemes:
    print("ERROR: No schemes found.", file=sys.stderr)
    sys.exit(1)
# Prefer a scheme whose name matches an app target.
# Otherwise use the first shared scheme.
print(schemes[0])
PY
          )
          if [ -z "$SCHEME" ]; then
            echo "::error::No Xcode scheme found."
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Selected scheme:"
          echo "$SCHEME"
      # Build the actual device .app.
      # No archive. No exportArchive. No provisioning profile.
      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          TYPE="${{ steps.container.outputs.type }}"
          PATH_TO_CONTAINER="${{ steps.container.outputs.path }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"
          BUILD_DIR="$RUNNER_TEMP/DerivedData"
          LOG="$RUNNER_TEMP/xcodebuild.log"
          rm -rf "$BUILD_DIR"
          rm -f "$LOG"
          echo "========================================"
          echo "Building unsigned iOS application"
          echo "========================================"
          echo "Container: $PATH_TO_CONTAINER"
          echo "Scheme:    $SCHEME"
          echo "SDK:       iphoneos"
          echo "Config:    Release"
          echo ""
          COMMON_ARGS=(
            -scheme "$SCHEME"
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$BUILD_DIR"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            DEVELOPMENT_TEAM=""
            PROVISIONING_PROFILE_SPECIFIER=""
            CODE_SIGN_STYLE=Manual
          )
          if [ "$TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$PATH_TO_CONTAINER" \
              "${COMMON_ARGS[@]}" \
              build 2>&1 | tee "$LOG"
          else
            xcodebuild \
              -project "$PATH_TO_CONTAINER" \
              "${COMMON_ARGS[@]}" \
              build 2>&1 | tee "$LOG"
          fi
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "XCODE BUILD FAILED"
            echo "========================================"
            echo ""
            echo "Actual Xcode errors:"
            grep -E "error:|fatal error:|BUILD FAILED|Command .* failed" "$LOG" \
              | tail -100 || true
            echo ""
            echo "Last 100 lines of Xcode output:"
            tail -100 "$LOG"
            exit "$STATUS"
          fi
          echo ""
          echo "Xcode build succeeded."
      # Find the device .app.
      - name: Locate built app
        id: app
        shell: bash
        run: |
          set -e
          BUILD_DIR="$RUNNER_TEMP/DerivedData"
          APP=$(find "$BUILD_DIR/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*/Release-iphoneos/*.app" \
            -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::Xcode succeeded but no Release-iphoneos .app was found."
            echo ""
            echo "Available products:"
            find "$BUILD_DIR/Build/Products" \
              -maxdepth 4 \
              -print | sort
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Built application:"
          echo "$APP"
      # Turn Payload/MyApp.app into MyApp.ipa.
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e
          APP="${{ steps.app.outputs.path }}"
          IPA_DIR="$RUNNER_TEMP/IPA"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          /usr/bin/zip \
            -qry \
            Unsigned.ipa \
            Payload
          if [ ! -f "$IPA_DIR/Unsigned.ipa" ]; then
            echo "::error::IPA creation failed."
            exit 1
          fi
          echo ""
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"
          ls -lh "$IPA_DIR/Unsigned.ipa"
      # Make sure the artifact really contains Payload/*.app.
      - name: Verify IPA
        shell: bash
        run: |
          set -e
          IPA="$RUNNER_TEMP/IPA/Unsigned.ipa"
          CHECK="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK"
          mkdir -p "$CHECK"
          unzip -q "$IPA" -d "$CHECK"
          APP_COUNT=$(find "$CHECK/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | wc -l \
            | tr -d ' ')
          if [ "$APP_COUNT" != "1" ]; then
            echo "::error::Expected exactly one Payload/*.app, found $APP_COUNT."
            unzip -l "$IPA"
            exit 1
          fi
          echo "IPA structure verified."
          echo ""
          echo "IPA contents:"
          unzip -l "$IPA" | head -40
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ${{ runner.temp }}/IPA/Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
