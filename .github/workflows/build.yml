name: Build Unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -e
          PROJECT=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" -print -quit)
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" -print -quit)
          if [ -n "$WORKSPACE" ]; then
            CONTAINER="-workspace"
            PROJECT_PATH="$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            CONTAINER="-project"
            PROJECT_PATH="$PROJECT"
          else
            echo "No Xcode project found"
            exit 1
          fi
          echo "Using: $PROJECT_PATH"
          SCHEME=$(xcodebuild -list \
            "$CONTAINER" "$PROJECT_PATH" |
            awk '/Schemes:/{getline; gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')
          if [ -z "$SCHEME" ]; then
            echo "Could not find scheme"
            exit 1
          fi
          echo "Using scheme: $SCHEME"
          rm -rf "$RUNNER_TEMP/Build"
          xcodebuild \
            "$CONTAINER" "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/Build" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP=$(find "$RUNNER_TEMP/Build/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*iphoneos*" \
            -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app was created"
            exit 1
          fi
          echo "Found: $APP"
          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -R "$APP" "$RUNNER_TEMP/IPA/Payload/"
          cd "$RUNNER_TEMP/IPA"
          zip -qry Unsigned.ipa Payload
          echo "Created:"
          ls -lh Unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ${{ runner.temp }}/IPA/Unsigned.ipa
          if-no-files-found: error
