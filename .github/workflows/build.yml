name: Build unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build \
            2>&1 | tee build.log
      - name: Create unsigned IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/Locus.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: Locus.app was not created."
            echo ""
            echo "Built products:"
            find build/Build/Products -maxdepth 3 -type d -print || true
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/Locus.app
          rm -f LocusPlus-unsigned.ipa
          zip -qry LocusPlus-unsigned.ipa Payload
          echo ""
          echo "IPA created successfully:"
          ls -lh LocusPlus-unsigned.ipa
      - name: Verify IPA
        run: |
          set -e
          unzip -t LocusPlus-unsigned.ipa
          unzip -l LocusPlus-unsigned.ipa | grep 'Payload/Locus.app/'
          echo ""
          echo "IPA verification passed."
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusPlus-unsigned
          path: LocusPlus-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Locus-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

