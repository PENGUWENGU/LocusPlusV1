name: Build Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -e
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" -print -quit)
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" -print -quit)
          if [ -n "$WORKSPACE" ]; then
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Found workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Found project: $PROJECT"
          else
            echo "::error::No .xcodeproj or .xcworkspace found."
            exit 1
          fi
      - name: Find scheme
        id: scheme
        shell: bash
        run: |
          set -e
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            LIST=$(xcodebuild -list -workspace "${{ steps.project.outputs.path }}")
          else
            LIST=$(xcodebuild -list -project "${{ steps.project.outputs.path }}")
          fi
          echo "$LIST"
          SCHEME=$(echo "$LIST" |
            awk '
              /Schemes:/ {found=1; next}
              found && NF {print; exit}
            ' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not automatically find an Xcode scheme."
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"
      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Unsigned.xcarchive"
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.project.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              archive
          else
            xcodebuild \
              -project "${{ steps.project.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              archive
          fi
          test -d "$ARCHIVE"
          echo "Archive created:"
          find "$ARCHIVE/Products" -maxdepth 3 -type d -name "*.app" -print
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/Unsigned.xcarchive"
          OUTPUT="$RUNNER_TEMP/ipa"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"
          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::No .app found in the archive."
            exit 1
          fi
          echo "Found app:"
          echo "$APP"
          cp -R "$APP" "$OUTPUT/Payload/"
          cd "$OUTPUT"
          zip -qry "Unsigned.ipa" Payload
          test -f "Unsigned.ipa"
          echo "IPA created:"
          ls -lh "Unsigned.ipa"
      - name: Verify IPA structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "$RUNNER_TEMP/ipa/Unsigned.ipa"
          unzip -q "$RUNNER_TEMP/ipa/Unsigned.ipa" \
            -d "$RUNNER_TEMP/ipa_check"
          APP=$(find "$RUNNER_TEMP/ipa_check/Payload" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::IPA does not contain Payload/*.app"
            exit 1
          fi
          echo "IPA structure is valid."
          echo "App: $APP"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/ipa/Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
