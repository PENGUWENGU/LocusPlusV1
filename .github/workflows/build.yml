name: Build Unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods --no-document
            pod install
          fi
      - name: Locate project
        id: locate
        shell: bash
        run: |
          set -e
          WORKSPACE=$(find . -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -print -quit)
          PROJECT=$(find . -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -print -quit)
          if [ -n "$WORKSPACE" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Using project: $PROJECT"
          else
            echo "::error::No Xcode project/workspace found."
            exit 1
          fi
      - name: List schemes
        shell: bash
        run: |
          if [ "${{ steps.locate.outputs.kind }}" = "workspace" ]; then
            xcodebuild -list \
              -workspace "${{ steps.locate.outputs.path }}"
          else
            xcodebuild -list \
              -project "${{ steps.locate.outputs.path }}"
          fi
      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR="$RUNNER_TEMP/Build"
          rm -rf "$BUILD_DIR"
          if [ "${{ steps.locate.outputs.kind }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.locate.outputs.path }}" \
              -scheme "$(basename "${{ steps.locate.outputs.path }}" .xcworkspace)" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$BUILD_DIR" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build
          else
            xcodebuild \
              -project "${{ steps.locate.outputs.path }}" \
              -scheme "$(basename "${{ steps.locate.outputs.path }}" .xcodeproj)" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$BUILD_DIR" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build
          fi
          APP=$(find "$BUILD_DIR/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*iphoneos*" \
            -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::Build completed but no .app was found."
            find "$BUILD_DIR" -type d -name "*.app" -print
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Found app: $APP"
      - name: Package IPA
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -R "$APP" "$RUNNER_TEMP/IPA/Payload/"
          cd "$RUNNER_TEMP/IPA"
          /usr/bin/zip -qry Unsigned.ipa Payload
          test -f Unsigned.ipa
          echo "IPA successfully created:"
          ls -lh Unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ${{ runner.temp }}/IPA/Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
